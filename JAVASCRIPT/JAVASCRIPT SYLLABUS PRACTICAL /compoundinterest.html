<html>
    <head>
        <title>
            getElementById.example5
        </title>
    </head>

    <body>
        <script>
            var principal = 1000, rate = 5;
            var time = parseInt (prompt ("Enter the number of year(s) below"));

            var amount = principal * Math.pow ((1 + rate / 100), time);

            document.write ("The amount is : " + parseFloat (amount));
        </script>
    </body>
</html>
