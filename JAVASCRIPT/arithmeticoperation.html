<html>
    <head>
        <title>
            My sixth JavaScript program
        </title>
    </head>

    <body>
        <script>
            var a=parseInt(prompt("Enter the value of a below"));
            var b=parseInt(prompt("Enter the value of b below"));

            document.write(a+b+'<br>');
            document.write(a-b+'<br>');
            document.write(a*b+'<br>');
            document.write(a/b+'<br>');
            document.write(a%b+'<br>');
            document.write(++a+'<br>');
            document.write(a++ + '<br>');
            document.write(--a + '<br>');
            document.write(a-- + '<br>');
            document.write(++b + '<br>');
            document.write(b++ + '<br>');
            document.write(--b + '<br>');
            document.write(b-- + '<br>');

        </script>
    </body>
</html>
