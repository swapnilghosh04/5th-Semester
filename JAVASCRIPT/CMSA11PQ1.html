<html>
    <head>
        <title>
            getElementbyId.example1
        </title>

    <body>
        <script>
            var table="|              square                  |             cube                 | \n";
            for (i = 5; i <= 15; i++) {
                var sq = i * i;
                var cu = i * i * i;
                table =`|           ${sq}             |         ${cu} \n `;
            }
            alert (table);
        </script>
    </body>
