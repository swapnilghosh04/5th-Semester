<html>
	<head>
		<title></title>
		<script>
			function f() {
			var p = parseInt(document.getElementById("t1").value);
			var r = parseInt(document.getElementById("t2").value);
			var t = parseInt(document.getElementById("t3").value);
			
			if(isNaN(p) || isNaN(r) || isNaN(t))
				alert("Enter valid value(s)");
			else {
				var a = p * Math.pow((1 + r / 100), t);
				document.write("Amount : " + parseFloat(a));
			}
			}
		</script>
	</head>
	
	<body>
		Enter Principal <input type = "text" id = "t1">
		<br>Enter rate <input type = "text" id = "t2">
		<br>Enter the number of years (n) <input type = "text" id = "t3">
		<br><br><input type = "button" value = "click" onClick = "f()"> 
	</body>
