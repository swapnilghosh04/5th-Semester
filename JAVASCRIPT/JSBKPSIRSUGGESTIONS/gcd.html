<html>
	<body>
		<script>
			function f(a, b) {
				if(a == b)
					return a;
				else if (a > b)
					return f((a - b), b);
				else
					return f(a, (b - a));
			}
			
			var a = parseInt(prompt("Enter  number"));
			var b = parseInt(prompt("Enter another number"));
			var c = f(a, b);
			
			document.write("The GCD of two numbers is "+ c);
		</script>
	</body>
</html>
